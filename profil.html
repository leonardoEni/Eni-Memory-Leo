<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Profil</title>
</head>
<body>
    <h1>ENI -<strong>MEMORY</strong>- Profil</h1>

        <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="inscription.html">S'inscrire</a></li>
            <li><a href="connexion.html">Se connecter</a></li>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="jouer.html">Jouer</a></li>
        </ul>
    </nav>

    <section>

            <article id="inscription-form">

                <fieldset>
                    <h2>Profil</h2>
                    
                    <form action="" method="post">
                        <label for="nom">Nom d'utilisateur :</label>
                        <input
                        type="text"
                        id="nom"
                        name="nom"
                        autofocus
                        required
                        placeholder="3 caractères minimum"
                        pattern="[A-Za-Z]{2,}"
                        title="Saisissez votre nom (2 caractères min.)"/>
                        <br/>
                       
                        <label for="email">Email : </label>
                        <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="votre email"
                        title="Saisissez votre adresse email"
                        />
                        <br/>

                        <label for="select">Choix du Memory :</label>
                        <select name="select" id="select">
                        <option value="valeur1">Fruits et legumes</option>
                        <option value="valeur2" selected>Lettres</option>
                        <option value="valeur3">autre valeu</option>
                        <option value="valeur4">valeur 4</option>
                        </select>

                        <br />



                        <image src="ressources\animauxAnimes\memory_detail_animaux_animes.png" alt="Image du tebleau à choisir"/>

                        
                        <br />

                        <label for="nombre">Taille du Memory :</label>
                        <input
                        type="number"
                        name="nombre"
                        id="nombre"
                        min="2"
                        max="12"
                        step="2"
                        />

                        <br/>
                        
                        <input type="submit" value="Enregistrez Option"/>
                        
                        
                    </form>

                </fieldset>



            </article>


        </section>
    
</body>
</html>
