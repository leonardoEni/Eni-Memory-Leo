<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

<body>
    
    <h1>ENI -<strong>MEMORY</strong>- S'inscrire</h1>

    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="inscription.html">S'inscrire</a></li>
            <li><a href="connexion.html">Se connecter</a></li>
            <li><a href="profil.html">Profil</a></li>

        </ul>
    </nav>

    <section id="blocCentralSInscrire">

        <article id="inscription-form">

            
            <h2>Inscrivez-vous.</h2>
                
            <form action="" method="post">
                <label for="nom">Nom d'utilisateur :</label><br>
                <input
                type="text"
                id="texte"
                name="nom"
                autofocus
                required
                placeholder="3 caractères minimum"
                size = 65px;
                pattern="[A-Za-Z]{2,}"
                title="Saisissez votre nom (2 caractères min.)"  />
                <p id="interactiveP">Choisissez un pseudo contenant au moins 3 caracteres.</p>
              
                <br/>

                <label for="email">Entrez votre email : </label><br>
                <input
                type="email"
                id="texte"
                name="email"
                placeholder="votre email"
                size = 65px;
                title="Saisissez votre adresse email"
                />
                <br/>


                <label for="motdePasse">Mot de passe :</label><br>
                <input
                type="password"
                id="texte"
                name="motdePasse"
                placeholder="votre mot de passe"
                size = 65px;
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                title="votre mot de passe"
                />
                <p id="inscription-text">Au moins un symbole, un chiffre, ainsique 6 caractères minimum.</p>
                <br/>

                <label for="motdePasse">Confirmez le mot de passe :</label><br>
                <input
                type="password"
                id="texte"
                name="motdePasse"
                placeholder="Confirmez le mot de passe"
                size = 65px;
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                title="votre mot de passe"
                />
                <br/>
                <div id="buttons">
                    <input type="submit" value="Création du compte"/>
                    <input type="reset"  value="Annuler"/>
                </div>
            </form>

            



        </article>


    </section>

    
    
</body>
</html>
